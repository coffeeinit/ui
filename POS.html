function viewOrders(){const T=[['all','All'],...Object.entries(TY).map(([k,t])=>[k,t.n]),['await','Awaiting payment']];
 $('#view').innerHTML=`<div class="ph"><h1>Orders</h1></div><div class="grid3" id="osum"></div><div class="card"><div class="tabs" role="tablist">${T.map(t=>`<button role="tab" aria-selected="${S.ot===t[0]}" data-a="otab" data-v="${t[0]}">${t[1]}</button>`).join('')}</div><div id="ot"></div></div>`;drawOrders()}
function fv(kind,v){return kind==='emp'?(emp(v)||{}).n:kind==='loc'?loc(v).n+' · '+loc(v).a:kind==='tags'?(v||[]).join(', '):v}
function orderHtml(id){const o=S.orders.find(x=>x.id===id),v=o.status==='Voided',st=o.mfg?FLM:FL,i=st.indexOf(o.ful),aw=o.pay==='Awaiting payment'&&!v;
 return `<div class="dlg"><h2 id="dt">Order #${o.id}</h2><p>${typeB(o.type)} ${payB(o)} ${stB(o)}</p>
 ${v?'':`<ol class="stp">${st.map((s,j)=>`<li class="${j<i||o.ful==='Delivered'?'d':j===i?'c':''}">${s}</li>`).join('')}</ol>`}
 <div class="kv"><span>Placed</span><span>${fmt(o.t)} by ${esc(o.by)} at ${esc(loc(o.reg).n)}</span></div>
 ${TY[o.type].f.filter(f=>o.f[f[0]]&&o.f[f[0]].length).map(f=>`<div class="kv"><span>${f[1].replace(/ \(.*\)/,'')}</span><span style="white-space:normal;text-align:right">${esc(fv(f[2],o.f[f[0]]))}</span></div>`).join('')}
 <div class="kv"><span>Cost centre</span><span>${o.cc?esc(o.cc):'—'}</span></div>
 ${o.items.map(x=>`<div class="kv"><span>${x.qty} × ${esc(x.title)}</span><span>${money(x.price*x.qty)}</span></div>`).join('')}
 ${o.d?`<div class="kv"><span>Discount${o.dlab?' · '+esc(o.dlab):''}</span><span>−${money(o.d)}</span></div>`:''}${o.dl&&o.dl.k!=='none'?`<div class="kv"><span>Delivery · ${DEL[o.dl.k][0]}${o.dl.who==='co'?' (company pays)':''}</span><span>${o.dl.who==='co'?'Free · '+money(o.dl.fee)+' absorbed':money(o.dl.fee)}</span></div>`:''}
 <div class="kv"><strong>Order value</strong><strong>${money(o.total)}</strong></div>
 <div class="kv"><span>Payment</span><span>${PM.find(p=>p[0]===o.pm)[1]} · ${o.pay}</span></div>
 ${o.note?`<div class="kv"><span>Note</span><span style="white-space:normal;text-align:right">${esc(o.note)}</span></div>`:''}
 ${aw&&o.link?shareHtml(o):''}
 <div class="foot">${v?'':`<button class="btn c" data-a="void" data-id="${o.id}" style="margin-right:auto">Void and restock</button>`}<button class="btn" onclick="print()">Print</button><button class="btn" data-a="reorder" data-id="${o.id}">Reorder</button><button class="btn" data-a="close">Close</button>${aw?`<button class="btn" data-a="paid" data-id="${o.id}">Mark as paid</button>`:''}${!v&&i<st.length-1?`<button class="btn p" data-a="adv" data-id="${o.id}">Mark as ${st[i+1].toLowerCase()}</button>`:''}</div></div>`}
function viewOrder(id){const o=ordr(id);if(!o)return go('orders');$('#view').innerHTML=`<div class="ph"><button class="btn" data-a="close">← Orders</button></div><div class="card" style="max-width:720px">${orderHtml(id)}</div>`;qr(o.pay==='Awaiting payment'&&o.status!=='Voided'?o:{})}
function discDlg(){const m=S.dtab,body=m==='manual'?`<div class="tags">${[['pct',5],['pct',10],['pct',15],['pct',20],['amt',50],['amt',100],['amt',500]].map(([k,v])=>`<button type="button" class="tag" data-a="dq" data-k="${k}" data-v="${v}">${k==='pct'?v+'%':CUR+v}</button>`).join('')}</div><div class="row2"><label>Type<select name="k"><option value="pct" ${S.disc.k==='pct'?'selected':''}>Percentage (%)</option><option value="amt" ${S.disc.k==='amt'?'selected':''}>Amount (${CUR})</option></select></label><label>Value<input name="v" type="number" min="0" step="0.01" value="${S.disc.v&&!S.disc.label?S.disc.v:''}"></label></div>`
 :m==='coupon'?`<label>Coupon code<input name="code" autocomplete="off" style="text-transform:uppercase" placeholder="Enter code"></label><div class="lab sub">Active coupons</div><div class="tags">${Object.entries(COUPONS).map(([k,c])=>`<button type="button" class="tag" data-a="cp" data-v="${k}" title="${c.n}">${k}</button>`).join('')}</div><p class="sub" style="margin:-4px 0 12px">${Object.entries(COUPONS).map(([k,c])=>k+' · '+c.n).join('<br>')}</p>`
 :`<label>Employee<select name="emp"><option value="">Select employee</option>${EMP.map(e=>`<option value="${e.id}">${esc(e.n)} · ${e.d}</option>`).join('')}</select></label><p class="sub" style="margin:-4px 0 12px">Staff purchase: ${EMPD}% off the whole order.</p>`;
 D(`<form id="df"><h2 id="dt">Discount</h2><div class="seg" style="padding:0 0 14px">${[['manual','Manual'],['coupon','Coupon code'],['emp','Employee']].map(t=>`<button type="button" data-a="dtab" data-v="${t[0]}" aria-pressed="${m===t[0]}">${t[1]}</button>`).join('')}</div>${body}<p class="err" id="de"></p><div class="foot">${S.disc.v>0?'<button type="button" class="btn c" data-a="cleardisc" style="margin-right:auto">Remove</button>':''}<button type="button" class="btn" data-a="close">Cancel</button><button class="btn p">Apply</button></div></form>`)}
function heldDlg(){D(`<div class="dlg"><h2 id="dt">Held carts</h2>${S.held.length?S.held.map(h=>{const c=calc(h),n=h.cart.reduce((a,l)=>a+l.qty,0);return `<div class="hl"><div class="lt"><strong>${n} item${n===1?'':'s'} · ${money(c.total)}</strong><br><span class="sub">${fmt(h.t)} · ${TY[h.type].n} · ${esc(h.cart.map(l=>l.qty+' × '+prod(l.pid).title).join(', '))}</span></div><button class="btn p" data-a="resume" data-id="${h.id}">Resume</button><button class="btn c" data-a="delheld" data-id="${h.id}">Delete</button></div>`}).join(''):'<div class="empty">No held carts. Tap Hold on the cart to park an order.</div>'}<div class="foot"><button class="btn" data-a="close">Close</button></div></div>`)}
function holdNow(){S.held.unshift({id:Date.now(),t:Date.now(),cart:S.cart,type:S.type,f:S.f,pm:S.pm,cc:S.cc,note:S.note,disc:S.disc,del:S.del})}
function redraw(){route==='checkout'?drawPay():drawLines()}

/* ---------- routing + events ---------- */
let route=location.hash.slice(1)||'register',drawn='';
function R(){if(route==='checkout'&&!S.cart.length)route='register';const k=route,top=k==='orders'||/^order-/.test(k)?'orders':'register';drawn=k;
 document.querySelectorAll('.tn a').forEach(a=>a.getAttribute('href')==='#'+top?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
 k==='orders'?viewOrders():/^order-\d+$/.test(k)?viewOrder(+k.slice(6)):k==='checkout'?viewCheckout():viewRegister();$('#cb').classList.toggle('on',k==='register');scrollTo(0,0)}
function go(r){route=r;try{location.hash=r}catch(e){}R()}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1)||'register';if(h===drawn)return;route=h;R()});
const line=id=>S.cart.find(l=>l.pid===id),ordr=id=>S.orders.find(o=>o.id===id);
document.addEventListener('click',async e=>{const nv=e.target.closest('.tn a');if(nv){e.preventDefault();return go(nv.getAttribute('href').slice(1))}const el=e.target.closest('[data-a]');if(!el)return;
 const a=el.dataset.a,id=+el.dataset.id,A={
  theme(){setTheme({auto:'light',light:'dark',dark:'auto'}[S.theme])},
  seg(){const t=el.dataset.v;if(t===S.type)return;S.keep[S.type]={f:S.f,pm:S.pm,cc:S.cc};S.type=t;const k=S.keep[t]||{f:{},pm:'cc',cc:t==='support'?'CC-SUPPORT':''};S.f=k.f;S.pm=k.pm;S.cc=k.cc;drawType();drawFields();drawPay()},
  hold(){if(!S.cart.length)return;holdNow();resetOrder();drawLines();toast('Cart held. Resume it from Held.')},held(){heldDlg()},
  resume(){const h=S.held.find(x=>x.id===id);if(!h)return;if(S.cart.length)holdNow();S.held=S.held.filter(x=>x!==h);Object.assign(S,{cart:h.cart,type:h.type,f:h.f,pm:h.pm,cc:h.cc,note:h.note,disc:h.disc,del:h.del,keep:{}});dlg.close();go('register');toast('Cart resumed')},
  delheld(){S.held=S.held.filter(x=>x.id!==id);heldDlg();$('#hn')&&($('#hn').textContent='Held ('+S.held.length+')')},
  dk(){S.del.k=el.dataset.v;drawPay()},dtab(){S.dtab=el.dataset.v;discDlg()},cp(){$('#df [name=code]').value=el.dataset.v},
  dq(){S.disc={k:el.dataset.k,v:+el.dataset.v,label:''};dlg.close();redraw()},
  cat(){S.cat=el.dataset.v;drawCats();drawTiles()},
  add(){const p=prod(id),l=line(id);l?l.qty++:S.cart.push({pid:id,qty:1});drawLines()},
  inc(){const l=line(id);if(avail(prod(id))>0)l.qty++;drawLines()},
  dec(){const l=line(id);if(--l.qty<=0)S.cart=S.cart.filter(x=>x!==l);drawLines()},
  clear(){resetOrder();drawFields();drawLines()},disc(){discDlg()},cleardisc(){S.disc={k:'pct',v:0};dlg.close();redraw()},
  cartopen(){$('#cart').classList.add('open')},cartclose(){$('#cart').classList.remove('open')},
  chk(){if(!S.cart.length)return;$('#cart').classList.remove('open');go('checkout')},close(){if(dlg.open)dlg.close();else if(/^order-/.test(route))go('orders');else if(route==='checkout')go('register')},
  tag(){const k=el.dataset.k,v=el.dataset.v,a=S.f[k]||[],on=!a.includes(v);S.f[k]=on?[...a,v]:a.filter(x=>x!==v);if(v==='Phone order')S.pm=on?'link':'cc';drawCF()},
  copy(){try{navigator.clipboard.writeText(el.dataset.v);toast('Link copied')}catch(x){toast('Copy not available here')}},
  otab(){S.ot=el.dataset.v;viewOrders()},row(){if(dlg.open)dlg.close();go('order-'+id)},
  async paid(){const o=ordr(id);await API.patch(o,{pay:'Paid'});el.dataset.done?doneView(o):R();toast('Marked as paid')},
  async adv(){const o=ordr(id),st=o.mfg?FLM:FL;await API.patch(o,{ful:st[st.indexOf(o.ful)+1]});R();toast('Order #'+id+' is now '+o.ful.toLowerCase())},
  async void(){const o=ordr(id);o.items.forEach(i=>{const p=prod(i.pid);if(p&&!p.mfg)p.stock+=i.qty});await API.patch(o,{status:'Voided'});go('orders');toast('Order #'+id+' voided, stock restored')},
  reorder(){const o=ordr(id);S.type=o.type;S.f=JSON.parse(JSON.stringify(o.f));S.pm=o.pm;S.cc=o.cc;S.note='';S.disc={k:'pct',v:0};S.del=noDel();S.cart=o.items.filter(i=>prod(i.pid)).map(i=>({pid:i.pid,qty:prod(i.pid).mfg?i.qty:Math.min(i.qty,prod(i.pid).stock)})).filter(l=>l.qty>0);go('register');toast('Order copied to cart')}
 };if(A[a])await A[a]()});
document.addEventListener('input',e=>{const el=e.target;
 if(el.id==='q'){S.q=el.value;drawTiles()}
 if(el.dataset.s&&el.type!=='radio')S[el.dataset.s]=el.value;
 if(el.dataset.dl==='amt'){S.del.amt=el.value;refreshTot()}
 if(el.dataset.f&&el.tagName!=='SELECT'){S.f[el.dataset.f]=el.value;refreshTot();el.removeAttribute('aria-invalid');const p=$('[data-e='+el.dataset.f+']');if(p)p.textContent=''}});
document.addEventListener('change',e=>{const el=e.target;
 if(el.id==='reg'){S.reg=el.value;return}
 if(el.dataset.q){const p=prod(+el.dataset.q),l=line(p.id),v=Math.floor(+el.value),mx=p.mfg?9999:p.stock;if(!(v>0))S.cart=S.cart.filter(x=>x!==l);else{l.qty=Math.min(v,mx);if(v>mx)toast('Only '+mx+' in stock')}drawLines();return}
 if(el.dataset.dl==='who'){S.del.who=el.value;drawPay();return}
 if(el.dataset.s){S[el.dataset.s]=el.value;if(el.dataset.s==='pm')drawPay();return}
 const k=el.dataset.f;if(!k)return;S.f[k]=el.value;
 if(k==='for'){const m=emp(el.value);if(m){S.f.loc=m.loc;S.cc=S.cc||m.cc}drawCF()}
 else if(k==='loc')drawCF();
 else if(k==='cust'){const c=CU.find(x=>x[0].toLowerCase()===el.value.trim().toLowerCase());if(c)Object.assign(S.f,{cust:c[0],em:c[1],ph:c[2],addr:c[3]});drawCF()}});
document.addEventListener('submit',e=>{e.preventDefault();
 if(e.target.id==='cf')place();
 if(e.target.id==='df'){const d=Object.fromEntries(new FormData(e.target)),m=S.dtab,er=t=>{$('#de').textContent=t};
  if(m==='manual'){const v=+d.v;if(!(v>0)||(d.k==='pct'&&v>100))return er(d.k==='pct'?'Enter a percentage between 0 and 100.':'Enter an amount above 0.');S.disc={k:d.k,v,label:''}}
  else if(m==='coupon'){const code=(d.code||'').trim().toUpperCase(),c=COUPONS[code],sub=calc().sub;if(!c)return er('That coupon code was not found.');if(sub<c.min)return er('Add '+money(c.min-sub)+' more to use '+code+'.');S.disc={k:c.k,v:c.v,min:c.min,label:'Coupon '+code}}
  else{const m2=emp(d.emp);if(!m2)return er('Select an employee.');S.disc={k:'pct',v:EMPD,label:'Employee · '+m2.n.split(' (')[0]}}
  dlg.close();redraw()}});
function save(){try{localStorage.setItem('pos-state',JSON.stringify({cart:S.cart,type:S.type,f:S.f,pm:S.pm,cc:S.cc,note:S.note,disc:S.disc,del:S.del,held:S.held,orders:S.orders,next:S.next,stock:Object.fromEntries(S.products.map(p=>[p.id,p.stock]))}))}catch(e){}}
try{const v=JSON.parse(localStorage.getItem('pos-state')||'null');if(v&&v.orders){const{stock,...r}=v;Object.assign(S,r);S.keep={};S.products.forEach(p=>{if(stock&&stock[p.id]!=null)p.stock=stock[p.id]})}}catch(e){}
['input','change','click'].forEach(t=>document.addEventListener(t,()=>{clearTimeout(save.t);save.t=setTimeout(save,150)}));
$('#reg').innerHTML=LOC.map(l=>`<option value="${l.id}">${l.n}</option>`).join('');
let t0='auto';try{t0=localStorage.getItem('pos-theme')||'auto'}catch(e){}setTheme(t0);
R();
</script>
</body>
</html>
